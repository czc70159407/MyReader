name: build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# 同分支并发构建互踩（run #7/#8 曾于 20s 内先后触发并发执行，后者失败于构建步骤）：
# 新推送自动取消同分支仍在进行的旧构建
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # ubuntu-latest 正滚动迁移至 26.04（2026-10-19 ~ 11-19，同一 label 先后落在不同镜像），
    # 本仓 CI 有环境抖动失败前科（run #8/#9/#19/#22），窗口内固定 24.04 防镜像漂移；
    # 窗口结束后改为 ubuntu-26.04 或恢复 ubuntu-latest
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        # 注意：submodule 不走 recursive——viewer 的嵌套 jni 子模块刻意不初始化，
        # native 层用官方 Maven 预编译 fitz AAR（见 README「构建」节）

      - name: Init MuPDF submodule
        # gitlink 指向自有 fork 的 myreader-patches 分支顶端 a5496f1
        # （epub 进度锚点 + layout 异常保护补丁已含在内，update --init 一步取全）
        run: git submodule update --init

      - name: Make gradlew executable
        # 仓库在 Windows 创建，gradlew（shell 脚本）可能无 executable bit
        run: chmod +x gradlew

      # Robolectric 运行时按需下载 android-all jar 至 ~/.m2/repository（setup-java 的
      # cache: gradle 只覆盖 ~/.gradle，不覆盖此处）——每次冷下载百 MB 级，网络抖动即失败
      # （run #8/#9 均失败于构建步骤、代码与通过的 #7 逐字节相同，环境抖动嫌疑最大）。
      # 固定 key 常驻缓存：命中则跳过下载，未命中自动回填
      - name: Cache Robolectric android-all (~/.m2)
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository
          key: robolectric-m2-${{ runner.os }}

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Build + unit tests (all variants)
        # shell: bash 显式启用 pipefail——gradle 退出码不被 tee 掩盖；
        # 控制台日志落盘，失败时随 artifact 留存（job 日志 API 匿名拉取 401/403 需 token，
        # run #8/#9/#15/#19 失败时均无法离线取证）
        shell: bash
        run: |
          ./gradlew build --stacktrace 2>&1 | tee build-console.log

      # T7 已收紧：detekt 挂 check（新违规即 build 失败，存量走 baseline 渐进清理），
      # 此步骤产出完整报告 artifact 供审阅（continue-on-error 保证 kover 报告步骤独立完成）
      - name: Static analysis + coverage (reports)
        continue-on-error: true
        run: ./gradlew detekt koverHtmlReport --continue

      - name: Upload quality reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: quality-reports
          path: |
            **/build/reports/detekt/detekt.html
            **/build/reports/kover/html/*
            **/build/reports/tests/**
            build-console.log
          if-no-files-found: ignore

      - name: Upload debug APK
        uses: actions/upload-artifact@v6
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
