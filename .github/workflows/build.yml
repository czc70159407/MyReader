name: build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# 同分支并发构建互踩（run #7/#8 曾于 20s 内先后触发并发执行，后者失败于构建步骤）：
# 新推送自动取消同分支仍在进行的旧构建
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # 注意：submodule 不走 recursive——viewer 的嵌套 jni 子模块刻意不初始化，
        # native 层用官方 Maven 预编译 fitz AAR（见 README「构建」节）

      - name: Init MuPDF submodule
        run: git submodule update --init

      - name: Apply MuPDF local patches
        # epub 进度锚点 + layout 异常保护（构建必需，见 third-party/patches/README.md）。
        # runner 默认无 git 身份，git am 需要提交者信息才能执行。
        # 补丁用 $GITHUB_WORKSPACE 绝对路径：bash 的相对通配符按 CWD（仓根）展开，而
        # git -C 会把参数再按 submodule 目录解析——两层解析错位会让字面 * 传给 git am
        # （run #2 瞬败根因：could not open '../../third-party/patches/*.patch'）
        run: |
          git config --global user.name "ci"
          git config --global user.email "ci@myreader.invalid"
          git -C third-party/mupdf-android-viewer am "$GITHUB_WORKSPACE"/third-party/patches/*.patch

      - name: Make gradlew executable
        # 仓库在 Windows 创建，gradlew（shell 脚本）可能无 executable bit
        run: chmod +x gradlew

      # Robolectric 运行时按需下载 android-all jar 至 ~/.m2/repository（setup-java 的
      # cache: gradle 只覆盖 ~/.gradle，不覆盖此处）——每次冷下载百 MB 级，网络抖动即失败
      # （run #8/#9 均失败于构建步骤、代码与通过的 #7 逐字节相同，环境抖动嫌疑最大）。
      # 固定 key 常驻缓存：命中则跳过下载，未命中自动回填
      - name: Cache Robolectric android-all (~/.m2)
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: robolectric-m2-${{ runner.os }}

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Build + unit tests (all variants)
        run: ./gradlew build --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
